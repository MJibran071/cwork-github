# Dependabot configuration for automated dependency updates and security scanning
version: 2
updates:
  # Monitor npm dependencies for backend services
  - package-ecosystem: "npm"
    directory: "/backend/auth-service"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "production"
    ignore:
      - dependency-name: "typescript" # Pinned to major version
      - dependency-name: "@nestjs/*" # Pinned to major version
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "automated"

  - package-ecosystem: "npm"
    directory: "/backend/marketplace-service"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "production"
    ignore:
      - dependency-name: "typescript" # Pinned to major version
      - dependency-name: "@nestjs/*" # Pinned to major version
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "automated"

  # Monitor npm dependencies for contracts
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "production"
    ignore:
      - dependency-name: "hardhat" # Pinned to major version
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "contracts"
      - "automated"

  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"

  # Monitor Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "docker"
      - "automated"

# Security updates configuration
security-updates:
  enable: true
  # Only apply security updates during business hours (9 AM to 5 PM UTC)
  schedule:
    time: "09:00"
    timezone: "UTC"
  commit-message:
    prefix: "security"
    include: "scope"
  labels:
    - "security"
    - "dependencies"
    - "automated"