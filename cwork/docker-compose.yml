version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cwork
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cwork-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cwork-network

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=cwork_auth
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_REFRESH_SECRET=your-super-secret-refresh-jwt-key-here
      - WEB3_PROVIDER_URL=https://mainnet.infura.io/v3/your-infura-project-id
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - cwork-network
    restart: unless-stopped

  # Marketplace Service
  marketplace-service:
    build:
      context: ./backend/marketplace-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=cwork_marketplace
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_EXPIRES_IN=7d
      - ETHEREUM_RPC_URL=https://mainnet.infura.io/v3/your-infura-project-id
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PRIVATE_KEY=your-private-key-here
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=your-openai-api-key-here
    depends_on:
      - postgres
      - redis
    networks:
      - cwork-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cwork-network:
    driver: bridge