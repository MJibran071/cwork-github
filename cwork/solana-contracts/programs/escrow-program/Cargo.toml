[package]
name = "escrow-program"
version = "0.1.0"
description = "Solana escrow program with SPL token support and fee system"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
solana-program = "~1.18.0"
spl-token = { version = "~3.3.0", features = ["no-entrypoint"] }
borsh = { version = "0.10.3", features = ["derive"] }
bincode = "1.3.3"
thiserror = "1.0.56"

[dev-dependencies]
solana-program-test = "~1.18.0"
solana-sdk = "~1.18.0"
spl-associated-token-account = "~1.1.1"